<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Certificate Verification</title>
<link rel="icon" type="image/png" href="logosmall.png">
<style>
/* ------------------------------
   Global Reset & Base
------------------------------ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #e0e7ff, transparent 60%),
    linear-gradient(180deg, #f9fafb, #eef2f7);
  color: #1f2937;
  display: flex;
  flex-direction: column;
}

/* ------------------------------
   Header
------------------------------ */
header {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  padding: 1.6rem 1rem 1.2rem;
  text-align: center;
  border-bottom: 1px solid #e5e7eb;
}

header img {
  max-height: 52px;
  display: block;
  margin: 0 auto;
}

header p {
  margin-top: 6px;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  color: #6b7280;
}

/* ------------------------------
   Main Layout
------------------------------ */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1.8rem 1rem;
}

/* ------------------------------
   Card
------------------------------ */
.card {
  width: 100%;
  max-width: 520px;
  padding: 2.4rem 2.2rem;
  border-radius: 20px;
  background:
    linear-gradient(180deg, #ffffff, #f9fafb);
  box-shadow:
    0 20px 40px rgba(0, 0, 0, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ------------------------------
   Titles
------------------------------ */
h2 {
  text-align: center;
  font-size: 1.45rem;
  font-weight: 600;
  margin-bottom: 0.35rem;
}

.subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: #6b7280;
  margin-bottom: 1.8rem;
}

/* ------------------------------
   Inputs & Select
------------------------------ */
select,
input {
  width: 100%;
  padding: 0.85rem 0.9rem;
  border-radius: 12px;
  border: 1px solid #d1d5db;
  margin-bottom: 1.1rem;
  font-size: 0.92rem;
  background: #f9fafb;
  transition: all 0.2s ease;
}

select:focus,
input:focus {
  outline: none;
  border-color: #2563eb;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

/* ------------------------------
   Buttons
------------------------------ */
button {
  width: 100%;
  padding: 0.85rem;
  border-radius: 12px;
  border: none;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
}

button:active {
  transform: translateY(0);
}

/* ------------------------------
   Download Button
------------------------------ */
.download-btn {
  margin-top: 0.7rem;
  padding: 0.65rem;
  border-radius: 10px;
  font-size: 0.88rem;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #ffffff;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.download-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
}

/* ------------------------------
   Loading
------------------------------ */
.loading {
  text-align: center;
  margin-top: 1.2rem;
  font-size: 0.85rem;
  color: #6b7280;
  display: none;
}

/* ------------------------------
   Result Box
------------------------------ */
.result {
  margin-top: 1.6rem;
  padding: 1.2rem;
  border-radius: 14px;
  font-size: 0.9rem;
  line-height: 1.45;
  animation: fadeUp 0.35s ease;
}

.success {
  background: linear-gradient(180deg, #ecfdf5, #f0fdf4);
  border: 1px solid #a7f3d0;
  color: #065f46;
}

.error {
  background: linear-gradient(180deg, #fef2f2, #fff1f1);
  border: 1px solid #fecaca;
  color: #991b1b;
  text-align: center;
}

/* ------------------------------
   Footer
------------------------------ */
footer {
  text-align: center;
  padding: 0.85rem;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
  background: rgba(255, 255, 255, 0.9);
  border-top: 1px solid #e5e7eb;
  color: #6b7280;
}
/* Spacing between multiple certificates in result */
.result p {
  margin-bottom: 0.6rem;
}

.result a {
  display: inline-block;
  margin-bottom: 1.2rem;
}

/* Extra separation between certificate blocks */
.result p + a + p {
  margin-top: 0.8rem;
}

</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Techspark Club Logo">
  <p>Think • Build • Spark</p>
</header>

<main>
  <div class="card">
    <h2>E-Certificate Verification</h2>
    <p class="subtitle">Select search type and enter details</p>

    <select id="searchType" onchange="toggleInput()">
      <option value="certificate">Certificate Number</option>
      <option value="regno">Registration Number</option>
    </select>

    <input type="text" id="searchInput" placeholder="Enter Certificate Number">

    <button onclick="searchCertificate()">Search</button>

    <div class="loading" id="loading">Searching certificates...</div>
    <div id="resultBox" class="result"></div>
  </div>
</main>

<footer>
  Powered by Techspark Club || Developed by Praveen M
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzkMhn07ppBIIXdGvJ9pdvRduhZjz9VRIxZW6Ub65VOTY-pGLTYr3pyeVLbvTX50xKObA/exec";

function toggleInput() {
  const type = document.getElementById("searchType").value;
  const input = document.getElementById("searchInput");
  input.value = "";
  input.placeholder = type === "certificate" ? "Enter Certificate Number" : "Enter Registration Number";
}

async function searchCertificate() {
  const type = document.getElementById("searchType").value;
  const value = document.getElementById("searchInput").value.trim();
  const loading = document.getElementById("loading");
  const resultBox = document.getElementById("resultBox");

  resultBox.style.display = "none";
  resultBox.innerHTML = "";

  if (!value) {
    resultBox.className = "result error";
    resultBox.textContent = "Please enter a value.";
    resultBox.style.display = "block";
    return;
  }

  loading.style.display = "block";

  try {
    const url = `${API_URL}?${type}=${encodeURIComponent(value)}`;
    const response = await fetch(url);
    const data = await response.json();

    loading.style.display = "none";

    if (data.status === "success") {
      resultBox.className = "result success";

      if (data.certificates) {
        let html = `<p><strong>Certificates Found:</strong> ${data.certificates.length}</p>`;
        data.certificates.forEach(c => {
          html += `
            <p><strong>${c.name}</strong><br>${c.event}</p>
            <a href="${c.link}" target="_blank" rel="noopener">
              <button class="download-btn">View / Download</button>
            </a>
          `;
        });
        resultBox.innerHTML = html;
      } else {
        resultBox.innerHTML = `
          <p><strong>${data.name}</strong></p>
          <p>${data.event}</p>
          <a href="${data.link}" target="_blank" rel="noopener">
            <button class="download-btn">View / Download</button>
          </a>
        `;
      }
    } else {
      resultBox.className = "result error";
      resultBox.textContent = data.message;
    }

  } catch (e) {
    loading.style.display = "none";
    resultBox.className = "result error";
    resultBox.textContent = "Something went wrong.";
  }

  resultBox.style.display = "block";
}
</script>

</body>
</html>
