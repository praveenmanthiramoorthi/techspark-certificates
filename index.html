<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Certificate Verification</title>
 <link rel="icon" type="image/png" href="logosmall.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", "Segoe UI", system-ui, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #f8fafc, #eef2f7);
    color: #1f2937;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #ffffff;
    padding: 1.4rem 1rem;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
  }

  header img { max-height: 50px; display: block; margin: 0 auto; }
  header p { margin-top: 4px; font-size: 0.85rem; color: #6b7280; }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 500px;
    padding: 2.2rem;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  h2 { text-align: center; margin-bottom: 0.4rem; }
  .subtitle { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 1.5rem; }

  select, input {
    width: 100%;
    padding: 0.8rem;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }

  button {
    width: 100%;
    padding: 0.8rem;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    cursor: pointer;
  }

  .download-btn {
    background: linear-gradient(135deg, #10b981, #059669);
    margin-top: 0.6rem;
    padding: 0.6rem;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    border: none;
  }

  .loading { text-align: center; margin-top: 1rem; display: none; color: #6b7280; }

  .result {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 12px;
    font-size: 0.9rem;
  }

  .success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; text-align: center; }

  footer {
    text-align: center;
    padding: 0.8rem;
    font-size: 0.75rem;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Techspark Club Logo">
  <p>Think • Build • Spark</p>
</header>

<main>
  <div class="card">
    <h2>E-Certificate Verification</h2>
    <p class="subtitle">Select search type and enter details</p>

    <select id="searchType" onchange="toggleInput()">
      <option value="certificate">Certificate Number</option>
      <option value="regno">Registration Number</option>
    </select>

    <input type="text" id="searchInput" placeholder="Enter Certificate Number">

    <button onclick="searchCertificate()">Search</button>

    <div class="loading" id="loading">Searching certificates...</div>
    <div id="resultBox" class="result"></div>
  </div>
</main>

<footer>
  Powered by Techspark Club || Developed by Praveen M
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzkMhn07ppBIIXdGvJ9pdvRduhZjz9VRIxZW6Ub65VOTY-pGLTYr3pyeVLbvTX50xKObA/exec";

function toggleInput() {
  const type = document.getElementById("searchType").value;
  const input = document.getElementById("searchInput");
  input.value = "";
  input.placeholder = type === "certificate" ? "Enter Certificate Number" : "Enter Registration Number";
}

async function searchCertificate() {
  const type = document.getElementById("searchType").value;
  const value = document.getElementById("searchInput").value.trim();
  const loading = document.getElementById("loading");
  const resultBox = document.getElementById("resultBox");

  resultBox.style.display = "none";
  resultBox.innerHTML = "";

  if (!value) {
    resultBox.className = "result error";
    resultBox.textContent = "Please enter a value.";
    resultBox.style.display = "block";
    return;
  }

  loading.style.display = "block";

  try {
    const url = `${API_URL}?${type}=${encodeURIComponent(value)}`;
    const response = await fetch(url);
    const data = await response.json();

    loading.style.display = "none";

    if (data.status === "success") {
      resultBox.className = "result success";

      if (data.certificates) {
        let html = `<p><strong>Certificates Found:</strong> ${data.certificates.length}</p>`;
        data.certificates.forEach(c => {
          html += `
            <p><strong>${c.name}</strong><br>${c.event}</p>
            <a href="${c.link}" target="_blank" rel="noopener">
              <button class="download-btn">View / Download</button>
            </a>
          `;
        });
        resultBox.innerHTML = html;
      } else {
        resultBox.innerHTML = `
          <p><strong>${data.name}</strong></p>
          <p>${data.event}</p>
          <a href="${data.link}" target="_blank" rel="noopener">
            <button class="download-btn">View / Download</button>
          </a>
        `;
      }
    } else {
      resultBox.className = "result error";
      resultBox.textContent = data.message;
    }

  } catch (e) {
    loading.style.display = "none";
    resultBox.className = "result error";
    resultBox.textContent = "Something went wrong.";
  }

  resultBox.style.display = "block";
}
</script>

</body>
</html>
